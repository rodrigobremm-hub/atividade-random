<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Plataforma de Exercícios: Caça aos Erros HTML & CSS</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 24px; color: #38bdf8; }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .selector-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      flex-wrap: wrap;
    }

    select, input, textarea {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

    .editors-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .editor-box {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    label { font-weight: bold; margin-bottom: 6px; color: #38bdf8; }

    textarea.code-area {
      height: 350px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      background-color: #020617;
      color: #4ade80;
    }

    .preview-container {
      margin-top: 20px;
      margin-bottom: 25px;
      background-color: #1e293b;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: #38bdf8;
      font-weight: bold;
    }
    iframe#live-preview {
      width: 100%;
      height: 380px;
      background-color: #ffffff;
      border: none;
      border-radius: 4px;
    }

    .action-area {
      display: flex;
      gap: 15px;
      align-items: center;
      background: #1e293b;
      padding: 15px;
      border-radius: 6px;
    }

    button.btn-primary {
      background-color: #10b981;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button.btn-primary:hover { background-color: #059669; }

    .pass-input {
      width: 220px;
      border: 1px solid #38bdf8;
    }

    #painel-verificacao {
      margin-top: 20px;
      padding: 20px;
      background-color: #1e293b;
      border-radius: 6px;
      display: none;
    }
    .status-placar { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .erro-item {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .corrigido { background-color: #064e3b; color: #6ee7b7; border: 1px solid #10b981; }
    .pendente { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    .form-group label { color: #f8fafc; }
  </style>
</head>
<body>

  <header>
    <h1>🎓 Central de Desafios: HTML & CSS (Pro Web)</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('praticar')">🎮 Praticar Exercícios</button>
    <button class="tab-btn" onclick="switchTab('criar')">➕ Criar Novo Desafio</button>
  </div>

  <!-- ABA 1: PRATICAR -->
  <div id="tab-praticar" class="tab-content active">
    <div class="selector-bar">
      <label for="select-desafio">Selecione o Desafio Real:</label>
      <select id="select-desafio" onchange="carregarDesafioSelecionado()"></select>
      <button onclick="gerarDesafioAleatorio()" style="background: #8b5cf6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">🎲 Gerar Site Surpresa Realista</button>
    </div>

    <div class="editors-container">
      <div class="editor-box">
        <label for="htmlCode">Código HTML:</label>
        <textarea id="htmlCode" class="code-area" spellcheck="false" oninput="atualizarPreview()"></textarea>
      </div>
      <div class="editor-box">
        <label for="cssCode">Código CSS:</label>
        <textarea id="cssCode" class="code-area" spellcheck="false" oninput="atualizarPreview()"></textarea>
      </div>
    </div>

    <!-- PREVIEW EM TEMPO REAL -->
    <div class="preview-container">
      <div class="preview-header">
        <span>🌐 Visualização Online do Site em Tempo Real</span>
        <span style="font-size: 12px; color: #94a3b8;">Renderização automática</span>
      </div>
      <iframe id="live-preview"></iframe>
    </div>

    <div class="action-area">
      <input type="password" id="senha-prof" class="pass-input" placeholder="🔒 Senha do Professor">
      <button class="btn-primary" onclick="verificarSolucao()">Verificar 10 Erros</button>
    </div>

    <div id="painel-verificacao">
      <div class="status-placar" id="placar"></div>
      <div id="lista-erros"></div>
    </div>
  </div>

  <!-- ABA 2: CRIAR NOVO EXERCÍCIO -->
  <div id="tab-criar" class="tab-content">
    <h2>Cadastrar Novo Exercício</h2>
    <p>Adicione um novo template de site com 10 regras de validação.</p>

    <div class="form-group">
      <label>Título do Desafio:</label>
      <input type="text" id="novo-titulo" placeholder="Ex: Landing Page Tech Startup">
    </div>

    <div class="editors-container">
      <div class="editor-box">
        <label>HTML com Erros:</label>
        <textarea id="novo-html" class="code-area" placeholder="Cole aqui o HTML..."></textarea>
      </div>
      <div class="editor-box">
        <label>CSS com Erros:</label>
        <textarea id="novo-css" class="code-area" placeholder="Cole aqui o CSS..."></textarea>
      </div>
    </div>

    <h3>Regras de Validação:</h3>
    <div id="regras-container"></div>
    <button onclick="adicionarCamposRegra()" style="background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 20px;">+ Adicionar Regra</button>

    <br>
    <button class="btn-primary" onclick="salvarNovoDesafio()">Salvar Desafio</button>
  </div>

  <script>
    const SENHA_CORRETA = "1@senai";

    let desafios = [
      {
        id: "iniciante",
        titulo: "🟢 Iniciante: Portal de Notícias de Tecnologia",
        html: `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tech News Online</title>
</head>
<body>
  <header>
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600" alt="Tech Banner">
    <h1>Lançamento do Novo Smartphone<h1>
  </header>

  <main>
    <a href="https://technews.com/materia">Leia a matéria completa</a>

    <p>O novo dispositivo conta com inteligência artificial avançada e <negrito>processador octa-core</negrito>.</p>

    <div class="noticia-card">
      <p>Confira os testes de desempenho executados em laboratório.</div></p>
    </div>
  </main>
</body>
</html>`,
        css: `a {
  text-decoration: underline
  color: #0284c7;
}

.noticia-card {
  background-color: #f8fafc;
  padding: 15px;
  border-width: 2px;
  border-style: solid;
  border-color: #e2e8f0
}

header {
  align-text: center;
}

h1 {
  font-weight: 700;
  font-size: 24;
}

img {
  max-width: 100%;
`,
        regras: [
          { tipo: "HTML", desc: "Corrigir o fechamento da tag `<h1>` (`</h1>`)", teste: (h, c) => h.includes('<h1>Lançamento do Novo Smartphone</h1>') },
          { tipo: "HTML", desc: "Substituir a tag inexistente `<negrito>` por uma tag válida (ex: `<strong>` ou `<b>`)", teste: (h, c) => !h.includes('<negrito>') },
          { tipo: "HTML", desc: "Corrigir o aninhamento incorreto de `</p></div>` no card da notícia", teste: (h, c) => h.includes('laboratório.</p></div>') || h.includes('laboratório.</p>\n    </div>') },
          { tipo: "HTML", desc: "Adicionar o atributo booleano de idioma correto na tag `<html>`", teste: (h, c) => h.includes('lang="pt-BR"') },
          { tipo: "HTML", desc: "Adicionar um id no elemento principal para possibilitar estilização específica (`id=\"principal\"`)", teste: (h, c) => h.includes('id="principal"') || !h.includes('<main>') },
          { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` após `text-decoration: underline`", teste: (h, c) => c.includes('text-decoration: underline;') || c.includes('text-decoration:underline;') },
          { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` após `border-color: #e2e8f0`", teste: (h, c) => c.includes('border-color: #e2e8f0;') || c.includes('border-color:#e2e8f0;') },
          { tipo: "CSS", desc: "Corrigir a propriedade `align-text` para `text-align`", teste: (h, c) => c.includes('text-align:') && !c.includes('align-text:') },
          { tipo: "CSS", desc: "Adicionar a unidade `px` no valor da propriedade `font-size: 24`", teste: (h, c) => /font-size:\s*24px/.test(c) },
          { tipo: "CSS", desc: "Fechar a chave `}` do bloco de regras da tag `img`", teste: (h, c) => /img\s*\{[^}]*\}/.test(c) }
        ]
      },
      {
        id: "intermediario",
        titulo: "🟡 Intermediário: App de Entregas & Restaurante",
        html: `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Food Express</title>
</head>
<body>
  <header>
    <h1>Food Express</h1>
  </header>

  <main>
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600" class="prato-img">

    <form action="/pedido">
      <label for="qtd-itens">Quantidade:</label>
      <input type="number" id="qtd-itens" min="1" max="10">

      <button type="submit" value="Enviar">Fazer Pedido</button>
    </form>

    <div class="menu-lista">
      <option>Hambúrguer Artesanal</option>
      <option>Batata Frita Especial</option>
      <option>Refrigerante 500ml</option>
    </div>

    <section class="restaurante-info">
      <h3>Tempo estimado de entrega: 30 min</h3>
      <p>Endereço: Av. Principal, 1000</p>
  </main>
</body>
</html>`,
        css: `#prato-img {
  width: 100%;
  border-radius: 8px;
}

.menu-lista {
  display: flex;
  direction-flex: row;
}

button:click {
  background-color: #15803d;
}

header {
  background-color: rgb(15, 23, 42, 0.9);
}

.restaurante-info {
  padding: 10px 15px 10px;
  font-family: Arial, sans-serif
}`,
        regras: [
          { tipo: "HTML", desc: "Substituir as tags `<option>` fora de um `<select>` por tags de lista (`<ul>`/`<li>`) ou parágrafos", teste: (h, c) => !h.includes('<option>') },
          { tipo: "HTML", desc: "Fechar a tag `<section class=\"restaurante-info\">` que ficou aberta", teste: (h, c) => h.includes('</section>') },
          { tipo: "HTML", desc: "Remover o atributo `value=\"Enviar\"` desnecessário em `<button type=\"submit\">`", teste: (h, c) => !h.includes('value="Enviar"') },
          { tipo: "HTML", desc: "Corrigir a estrutura adicionando o atributo `name=\"quantidade\"` ao input de número", teste: (h, c) => h.includes('name=') },
          { tipo: "HTML", desc: "Envolver o rodapé com a tag semântica `<footer>` ao invés de fechar diretamente no `<main>`", teste: (h, c) => h.includes('<footer>') },
          { tipo: "CSS", desc: "Trocar o seletor de ID `#prato-img` pelo seletor de classe `.prato-img`", teste: (h, c) => c.includes('.prato-img') && !c.includes('#prato-img') },
          { tipo: "CSS", desc: "Corrigir a propriedade `direction-flex` para `flex-direction`", teste: (h, c) => c.includes('flex-direction:') && !c.includes('direction-flex:') },
          { tipo: "CSS", desc: "Corrigir o nome da pseudo-classe de estado de clique de `:click` para `:active`", teste: (h, c) => c.includes('button:active') },
          { tipo: "CSS", desc: "Corrigir a sintaxe da função `rgb()` ajustando para `rgba()` para aceitar o canal alfa", teste: (h, c) => c.includes('rgba(') },
          { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` no final da declaração `font-family`", teste: (h, c) => c.includes('sans-serif;') }
        ]
      },
      {
        id: "dificil",
        titulo: "🔴 Difícil: Plataforma SaaS & Gestão Financeira",
        html: `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FinDash SaaS</title>

  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>FinDash</h1>
    <nav>
      <a href="/dash" class="nav-link active" class="primary">Início</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Resumo da Conta</h2>
      <button onclick="carregarDados()">Atualizar</button>
    </section>

    <div class="kpi-card" tabindex="-1">
      <p>Saldo Atual: R$ 12.500,00</p>
    </div>

    <form class="filter-form">
      <input type="text" placeholder="Buscar transação" disabled="true">
    </form>
  </main>
</body>
</html>`,
        css: `.kpi-card {
  position: fixed;
  top: 10%;
  left: 10%;
  box-shadow: 0px 4px 10px #00000033;
  width: calc(100% - 20px);
}

.filter-form input:disabled {
  background-color: #f1f5f9
  cursor: not-allowed;
}

.nav-link.active {
  color: #0284c7;
  border-bottom: 2px solid #0284c7
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.kpi-card {
  animation-name: fade;
  animation-duration: 2;
}`,
        regras: [
          { tipo: "HTML", desc: "Corrigir atributos `class` duplicados na mesma tag `<a>` mesclando em `class=\"nav-link active primary\"`", teste: (h, c) => (h.match(/class=/g) || []).length <= 4 && !h.includes('class="nav-link active" class="primary"') },
          { tipo: "HTML", desc: "Remover a função inline `onclick=\"carregarDados()\"` substituindo por um ID para controle via JS", teste: (h, c) => !h.includes('onclick=') },
          { tipo: "HTML", desc: "Ajustar o atributo `tabindex=\"-1\"` para `tabindex=\"0\"` tornando o card focável por acessibilidade", teste: (h, c) => !h.includes('tabindex="-1"') },
          { tipo: "HTML", desc: "Corrigir o atributo booleano `disabled=\"true\"` para apenas `disabled`", teste: (h, c) => !h.includes('disabled="true"') },
          { tipo: "HTML", desc: "Adicionar o elemento `<label>` associado ao campo de busca do formulário", teste: (h, c) => h.includes('<label') },
          { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` no final da declaração `background-color: #f1f5f9`", teste: (h, c) => c.includes('background-color: #f1f5f9;') || c.includes('background-color:#f1f5f9;') },
          { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` no final da declaração `border-bottom`", teste: (h, c) => c.includes('border-bottom: 2px solid #0284c7;') || c.includes('border-bottom:2px solid #0284c7;') },
          { tipo: "CSS", desc: "Adicionar a unidade de tempo `s` em `animation-duration: 2s`", teste: (h, c) => /animation-duration:\s*2s/.test(c) },
          { tipo: "CSS", desc: "Corrigir o valor de transparência no código de cor hexadecimal do `box-shadow`", teste: (h, c) => !c.includes('#00000033') || c.includes('rgba(') },
          { tipo: "CSS", desc: "Unificar os seletores duplicados `.kpi-card` em um único bloco de estilo", teste: (h, c) => (c.match(/\.kpi-card\s*\{/g) || []).length <= 1 }
        ]
      }
    ];

    let desafioAtual = null;

    function init() {
      atualizarSelectDesafios();
      carregarDesafioSelecionado();
      for(let i=0; i<3; i++) adicionarCamposRegra();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tab === 'praticar') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-praticar').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-criar').classList.add('active');
      }
    }

    function atualizarSelectDesafios() {
      const select = document.getElementById('select-desafio');
      select.innerHTML = '';
      desafios.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = d.titulo;
        select.appendChild(opt);
      });
    }

    function carregarDesafioSelecionado() {
      const idx = document.getElementById('select-desafio').value || 0;
      desafioAtual = desafios[idx];
      document.getElementById('htmlCode').value = desafioAtual.html;
      document.getElementById('cssCode').value = desafioAtual.css;
      document.getElementById('painel-verificacao').style.display = 'none';
      document.getElementById('senha-prof').value = '';
      
      atualizarPreview();
    }

    function atualizarPreview() {
      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      const iframe = document.getElementById('live-preview');
      
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <style>${css}</style>
        </head>
        <body>
          ${html}
        </body>
        </html>
      `);
      doc.close();
    }

    function verificarSolucao() {
      const senhaInformada = document.getElementById('senha-prof').value;

      if (senhaInformada !== SENHA_CORRETA) {
        alert('🔒 Acesso negado! A verificação exige a senha do professor.');
        return;
      }

      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      
      let acertos = 0;
      const listaEl = document.getElementById('lista-erros');
      listaEl.innerHTML = '';

      desafioAtual.regras.forEach(regra => {
        const pass = regra.teste(html, css);
        const div = document.createElement('div');
        div.className = `erro-item ${pass ? 'corrigido' : 'pendente'}`;
        div.innerHTML = `${pass ? '✅' : '❌'} <strong>[${regra.tipo}]</strong> ${regra.desc}`;
        listaEl.appendChild(div);
        if(pass) acertos++;
      });

      document.getElementById('placar').textContent = `Pontuação: ${acertos} de ${desafioAtual.regras.length} erros corrigidos!`;
      document.getElementById('painel-verificacao').style.display = 'block';
    }

    function gerarDesafioAleatorio() {
      const sitesGerais = [
        {
          nome: "Livraria & Editora Cultura",
          imgHero: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600",
          imgProd: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=600"
        },
        {
          nome: "Clínica Veterinária PetCare",
          imgHero: "https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=600",
          imgProd: "https://images.unsplash.com/photo-1576201836106-db1758fd1c97?w=600"
        },
        {
          nome: "Escola de Música Harmony",
          imgHero: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600",
          imgProd: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=600"
        }
      ];

      const site = sitesGerais[Math.floor(Math.random() * sitesGerais.length)];

      const novoHtml = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>${site.nome}</title>
</head>
<body>
  <header>
    <img src="${site.imgHero}" alt="Capa">
    <h1>${site.nome}<h1>
  </header>

  <main>
    <a href="https://site.com/contato">Entre em contato conosco</a>

    <p>Oferecemos o melhor atendimento e <destaque>serviços personalizados</destaque>.</p>

    <div class="card-info">
      <p>Venha conhecer nossas instalações de perto.</div></p>
    </div>
  </main>
</body>
</html>`;

      const novoCss = `a {
  color: #0284c7
  text-decoration: none;
}

.card-info {
  background-color: #f1f5f9;
  padding: 20px;
  border-color: #cbd5e1
}

header {
  align-text: center;
}

h1 {
  font-size: 28;
}

img {
  width: 100%;
`;

      const regras = [
        { tipo: "HTML", desc: "Corrigir fechamento da tag `<h1>` (`</h1>`)", teste: (h, c) => h.includes('<h1>' + site.nome + '</h1>') },
        { tipo: "HTML", desc: "Substituir a tag inválida `<destaque>` por uma tag semântica válida", teste: (h, c) => !h.includes('<destaque>') },
        { tipo: "HTML", desc: "Corrigir a inversão de fechamento `</p></div>` no card de informações", teste: (h, c) => h.includes('perto.</p></div>') || h.includes('perto.</p>\n    </div>') },
        { tipo: "HTML", desc: "Adicionar id ao container principal `<main id=\"conteudo\">`", teste: (h, c) => h.includes('id="conteudo"') || !h.includes('<main>') },
        { tipo: "HTML", desc: "Adicionar o atributo booleano de idioma correto na tag `<html>`", teste: (h, c) => h.includes('lang="pt-BR"') },
        { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` na cor da tag `a`", teste: (h, c) => c.includes('color: #0284c7;') || c.includes('color:#0284c7;') },
        { tipo: "CSS", desc: "Adicionar o ponto e vírgula `;` na propriedade `border-color`", teste: (h, c) => c.includes('border-color: #cbd5e1;') || c.includes('border-color:#cbd5e1;') },
        { tipo: "CSS", desc: "Corrigir a propriedade `align-text` para `text-align`", teste: (h, c) => c.includes('text-align:') && !c.includes('align-text:') },
        { tipo: "CSS", desc: "Adicionar a unidade `px` na propriedade `font-size: 28`", teste: (h, c) => /font-size:\s*28px/.test(c) },
        { tipo: "CSS", desc: "Fechar a chave `}` da regra da imagem", teste: (h, c) => /img\s*\{[^}]*\}/.test(c) }
      ];

      desafioAtual = { titulo: `🎲 Site Realista: ${site.nome}`, html: novoHtml, css: novoCss, regras: regras };
      document.getElementById('htmlCode').value = novoHtml;
      document.getElementById('cssCode').value = novoCss;
      document.getElementById('painel-verificacao').style.display = 'none';
      document.getElementById('senha-prof').value = '';
      
      atualizarPreview();
    }

    function adicionarCamposRegra() {
      const container = document.getElementById('regras-container');
      const div = document.createElement('div');
      div.className = 'form-group-regra';
      div.style = "display: flex; gap: 10px; margin-bottom: 10px;";
      div.innerHTML = `
        <select class="regra-tipo"><option>HTML</option><option>CSS</option></select>
        <input type="text" class="regra-desc" placeholder="Descrição do erro a corrigir" style="flex: 1;">
        <input type="text" class="regra-busca" placeholder="Texto exato que DEVE existir após corrigir" style="flex: 1;">
      `;
      container.appendChild(div);
    }

    function salvarNovoDesafio() {
      const titulo = document.getElementById('novo-titulo').value || "Desafio Personalizado";
      const html = document.getElementById('novo-html').value;
      const css = document.getElementById('novo-css').value;

      const regrasEl = document.querySelectorAll('.form-group-regra');
      const regras = [];

      regrasEl.forEach(el => {
        const tipo = el.querySelector('.regra-tipo').value;
        const desc = el.querySelector('.regra-desc').value;
        const busca = el.querySelector('.regra-busca').value;

        if(desc && busca) {
          regras.push({
            tipo: tipo,
            desc: desc,
            teste: (h, c) => tipo === 'HTML' ? h.includes(busca) : c.includes(busca)
          });
        }
      });

      if(regras.length === 0) {
        alert('Adicione pelo menos 1 regra válida com descrição e texto esperado!');
        return;
      }

      desafios.push({ id: Date.now(), titulo: "🔹 " + titulo, html, css, regras });
      atualizarSelectDesafios();
      document.getElementById('select-desafio').value = desafios.length - 1;
      carregarDesafioSelecionado();
      switchTab('praticar');
      alert('Novo desafio salvo com sucesso!');
    }

    window.onload = init;
  </script>
</body>
</html>
